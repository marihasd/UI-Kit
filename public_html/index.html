<html>
    <head>
        <title>UI Kit</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                background: #f0f8ff;
                text-align: left;
            }
             header {
                background-color: #4682B4;
                color: white;
                padding: 20px 0;
                font-size: 24px;
                font-weight: bold;
            }
             .button-section {
                margin-top: 40px;
                display: flex;
                justify-content: center;
                gap: 30px;
                flex-wrap: wrap;
             }
             .cloud-button {
                background: none;
                border: none;
                cursor: pointer;
                padding: 0;
                outline: none;
             }

             .cloud-svg {
                width: 200px;
                height: 120px;
                transition: transform 0.2s;
             }

            .cloud-svg:hover {
                transform: scale(1.05);
             }

             .cloud-text {
                font-family: sans-serif;
                font-size: 16px;
                fill: white;
                pointer-events: none;
             }
        </style>
    
    </head>
    <body>
        <div>TODO write content</div>
        <div>Create UI Stuff!<div>
                <button class="cloud-button">
                    <svg class="cloud-svg" viewBox="0 0 200 100">
                        <path d="M60,80 
                            C40,90 30,70 50,60 
                            C40,50 30,40 50,30 
                            C60,10 90,10 100,30 
                            C120,20 140,30 130,50 
                            C150,70 120,80 100,80 Z"
                          fill="#87CEFA" stroke="#4682B4" stroke-width="2" />
                        <text x="100" y="55" class="cloud-text" text-anchor="middle" dominant-baseline="middle">
                            Click Me
                        </text>
                    </svg>

                </button>
    </body>
        
</html>

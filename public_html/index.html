<html>
    <head>
        <title>UI Kit</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                background: #f0f8ff;
                text-align: left;
            }
             header {
                background-color: #4682B4;
                color: white;
                padding: 20px 0;
                font-size: 24px;
                font-weight: bold;
            }
             .button-section {
                margin-top: 40px;
                display: flex;
                justify-content: center;
                gap: 30px;
                flex-wrap: wrap;
             }
             .cloud-button {
                background: none;
                border: none;
                cursor: pointer;
                padding: 0;
                outline: none;
             }

             .cloud-svg {
                width: 200px;
                height: 120px;
                transition: transform 0.2s;
             }

            .cloud-svg:hover {
                transform: scale(1.05);
                filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
             }
             
             .cloud-svg:hover .cloud-path {
                fill: #B0E0FF; /* Lighter blue on hover */
             }

             .cloud-text {
                font-family: sans-serif;
                font-size: 16px;
                fill: white;
                pointer-events: none;
             }
        </style>
    
    </head>
    <body>
        <div>TODO write content</div>
        <div>Create UI Stuff!<div>
                <button class="cloud-button">
                    <svg class="cloud-svg" viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg" onclick="handleCloudClick()">
                        <path class="cloud-path"
                            d="
                            M60,60
                            C55,40 75,30 90,40
                            C95,20 125,20 130,40
                            C145,30 165,40 160,60
                            C180,65 180,85 150,85
                            H70
                            C40,85 40,65 60,60
                            Z" 
                            fill="#87CEFA" stroke="#4682B4" stroke-width="2" />
                        <text x="110" y="68" class="cloud-text" text-anchor="middle" dominant-baseline="middle">
                             Click Me
                        </text>
                    </svg>
                    <script>
                        function handleCloudClick() {
                         alert("You clicked the cloud!");
                           //Later:
                           // - redirect: window.location.href = 'https://example.com';
                        }
</script>

                </button>
    </body>
        
</html>
